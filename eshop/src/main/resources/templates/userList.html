<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User list</title>
</head>
<body>
<div th:insert="~{fragments/menu :: #nav-menu}"></div>

<table border="1">
    <thead>
    <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.name}">Username</td>
        <td th:text="${user.email}">Email</td>
        <td th:text="${user.role}">Role</td>
        <td>
            <div sec:authorize="hasRole('ADMIN')">
                <form th:action="@{/users/assign-manager/{id}(id=${user.id})}" method="post">
                    <button type="submit"
                            th:text="${user.role == 'ROLE_MANAGER' ? 'Revoke Manager' : 'Make Manager'}">
                        Change Role
                    </button>
                </form>
            </div>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
